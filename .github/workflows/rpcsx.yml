name: Build RPCSX

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build-android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: armv8-a

    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
      RX_VERSION: 'Unknown'
      RX_SHA: 'Unknown'

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        lfs: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Configure
      run: |
        cmake \
          -B build -S android -DANDROID_ABI=${{ matrix.abi }} \
          -DUSE_ARCH=${{ matrix.arch }} \
          -DANDROID_PLATFORM=android-29 \
          -DANDROID_NDK=$ANDROID_NDK_HOME \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DCMAKE_BUILD_TYPE=Release -G Ninja
        RX_VERSION=$(awk -F'-' '{print $1}' android/.rx.version)
        RX_SHA=$(awk -F'-' '{print $5}' android/.rx.version)
        echo "RX_VERSION=$RX_VERSION" >> "${{ github.env }}"
        echo "RX_SHA=$RX_SHA" >> "${{ github.env }}"

    - name: Build
      run: |
        cmake --build build -- -j4
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/librpcsx-android.so
        mv build/librpcsx-android.so librpcsx-android-${{ matrix.abi }}-${{ matrix.arch }}.so

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: librpcsx-android
        path: librpcsx-android-arm64-v8a-armv8-a.so
        if-no-files-found: error

    - name: Cleanup
      if: always()
      run: |
        rm -rf build
        git submodule deinit -f --all
